[workspace]
resolver = "3"
members = ["crates/carbine-core", "crates/carbine-native", "crates/carbine-render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/AntacidDT/Carbine"

[workspace.dependencies]
bevy_ecs = "0.20.0"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34.1"
pollster = "0.4"
pyo3 = "0.30.1"
wgpu = "30.0.1"
winit = "0.30.13"
